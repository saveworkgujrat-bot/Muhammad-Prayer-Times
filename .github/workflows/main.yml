name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: unzip muhammad-prayer-times.zip -d extracted_project

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        if [ -d "extracted_project/android" ]; then
          cd extracted_project/android
        elif [ -d "android" ]; then
          cd android
        else
          echo "Android folder not found!" && exit 1
        fi
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: prayer-times-apk
        path: |
          extracted_project/android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/apk/debug/app-debug.apk

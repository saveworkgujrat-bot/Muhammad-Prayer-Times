          cat > android/app/src/main/java/com/muhammadprayertimes/app/PrayerWidget.kt << 'KTEOF'
package com.muhammadprayertimes.app

import android.appwidget.AppWidgetManager
import android.appwidget.AppWidgetProvider
import android.content.Context
import android.widget.RemoteViews
import java.util.Calendar
import kotlin.math.abs

class PrayerWidget : AppWidgetProvider() {
    override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
        for (id in appWidgetIds) updateAppWidget(context, appWidgetManager, id)
    }

    companion object {
        // Gujrat prayer times (approximate, summer)
        val PRAYERS = listOf(
            Triple("Fajr",    3 * 60 + 15,  "3:15 AM"),
            Triple("Dhuhr",  12 * 60 + 5,  "12:05 PM"),
            Triple("Asr",    17 * 60 + 3,   "5:03 PM"),
            Triple("Maghrib",19 * 60 + 14,  "7:14 PM"),
            Triple("Isha",   20 * 60 + 55,  "8:55 PM")
        )

        fun updateAppWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
            val views = RemoteViews(context.packageName, R.layout.prayer_widget_layout)
            val cal = Calendar.getInstance()
            val now = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)

            var nextPrayer = PRAYERS[0]
            var minDiff = Int.MAX_VALUE
            for (p in PRAYERS) {
                val diff = p.second - now
                if (diff > 0 && diff < minDiff) { minDiff = diff; nextPrayer = p }
            }
            if (minDiff == Int.MAX_VALUE) {
                nextPrayer = PRAYERS[0]
                minDiff = 1440 - now + PRAYERS[0].second
            }

            val hh = minDiff / 60
            val mm = minDiff % 60
            val ss = cal.get(Calendar.SECOND)
            val countdown = String.format("%02d:%02d:%02d", hh, mm, 60 - ss)

            views.setTextViewText(R.id.widget_prayer_name, nextPrayer.first)
            views.setTextViewText(R.id.widget_prayer_time, nextPrayer.third)
            views.setTextViewText(R.id.widget_countdown, countdown)
            views.setTextViewText(R.id.widget_location, "Gujrat")

            // Highlight current/next prayer in schedule
            val prayerIds = listOf(
                Triple(R.id.fajr_name, R.id.fajr_time, PRAYERS[0]),
                Triple(R.id.dhuhr_name, R.id.dhuhr_time, PRAYERS[1]),
                Triple(R.id.asr_name, R.id.asr_time, PRAYERS[2]),
                Triple(R.id.maghrib_name, R.id.maghrib_time, PRAYERS[3]),
                Triple(R.id.isha_name, R.id.isha_time, PRAYERS[4])
            )
            for ((nameId, timeId, prayer) in prayerIds) {
                val color = if (prayer.first == nextPrayer.first) 0xFF10B981.toInt() else 0xCCFFFFFF.toInt()
                val timeColor = if (prayer.first == nextPrayer.first) 0xFF10B981.toInt() else 0x88AAAAAA.toInt()
                views.setTextColor(nameId, color)
                views.setTextColor(timeId, timeColor)
                views.setTextViewText(timeId, prayer.third)
            }

            appWidgetManager.updateAppWidget(appWidgetId, views)
        }
    }
}
KTEOF

      - name: Register Widget in AndroidManifest
        run: |
          sed -i 's|</application>|    <receiver android:name="com.muhammadprayertimes.app.PrayerWidget" android:exported="true">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/prayer_widget_info" />\n        </receiver>\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin Version Conflict
        run: |
          cd android
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy {" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muhammad-prayer-times-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

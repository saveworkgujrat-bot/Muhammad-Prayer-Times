name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Project Structure
        run: |
          mkdir -p src/components src/utils
          [ -f App.tsx ] && mv App.tsx src/
          [ -f main.tsx ] && mv main.tsx src/
          [ -f index.css ] && mv index.css src/
          [ -f types.ts ] && mv types.ts src/
          [ -f SettingsModal.tsx ] && mv SettingsModal.tsx src/components/
          [ -f audioSynth.ts ] && mv audioSynth.ts src/utils/
          [ -f prayerCalc.ts ] && mv prayerCalc.ts src/utils/

      - name: Install Dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "APP_URL=http://localhost" >> .env

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor
        run: npx cap init "Muhammad Prayer Times" "com.muhammadprayertimes.app" --web-dir=dist

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create Widget Files
        run: |
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/java/com/muhammadprayertimes/app

          cat > android/app/src/main/res/xml/prayer_widget_info.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/prayer_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen">
          </appwidget-provider>
          XMLEOF

          cat > android/app/src/main/res/drawable/widget_background.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#CC022C22" />
              <corners android:radius="16dp" />
              <stroke android:width="1dp" android:color="#2010B981" />
          </shape>
          XMLEOF

          cat > android/app/src/main/res/layout/prayer_widget_layout.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@drawable/widget_background"
              android:padding="16dp"
              android:gravity="center">
              <TextView
                  android:id="@+id/widget_label"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Next Prayer"
                  android:textColor="#80FFFFFF"
                  android:textSize="11sp" />
              <TextView
                  android:id="@+id/widget_prayer_name"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Asr"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginTop="2dp" />
              <TextView
                  android:id="@+id/widget_prayer_time"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="3:45 PM"
                  android:textColor="#10B981"
                  android:textSize="18sp"
                  android:layout_marginTop="2dp" />
              <TextView
                  android:id="@+id/widget_countdown"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="in 1h 23m"
                  android:textColor="#80FFFFFF"
                  android:textSize="13sp"
                  android:layout_marginTop="4dp" />
          </LinearLayout>
          XMLEOF

          cat > android/app/src/main/java/com/muhammadprayertimes/app/PrayerWidget.kt << 'KTEOF'
          package com.muhammadprayertimes.app

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews
          import java.util.Calendar

          class PrayerWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      updateAppWidget(context, appWidgetManager, appWidgetId)
                  }
              }
              companion object {
                  fun updateAppWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                      val views = RemoteViews(context.packageName, R.layout.prayer_widget_layout)
                      val cal = Calendar.getInstance()
                      val currentMinutes = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                      val prayers = listOf(Pair("Fajr", 300), Pair("Dhuhr", 750), Pair("Asr", 945), Pair("Maghrib", 1110), Pair("Isha", 1200))
                      var nextPrayer = prayers[0]
                      var minDiff = Int.MAX_VALUE
                      for (prayer in prayers) {
                          val diff = prayer.second - currentMinutes
                          if (diff > 0 && diff < minDiff) { minDiff = diff; nextPrayer = prayer }
                      }
                      if (minDiff == Int.MAX_VALUE) { nextPrayer = prayers[0]; minDiff = (1440 - currentMinutes) + prayers[0].second }
                      val h = nextPrayer.second / 60
                      val m = nextPrayer.second % 60
                      val ampm = if (h < 12) "AM" else "PM"
                      val dh = if (h > 12) h - 12 else if (h == 0) 12 else h
                      views.setTextViewText(R.id.widget_prayer_name, nextPrayer.first)
                      views.setTextViewText(R.id.widget_prayer_time, String.format("%d:%02d %s", dh, m, ampm))
                      views.setTextViewText(R.id.widget_countdown, String.format("in %dh %02dm", minDiff/60, minDiff%60))
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          KTEOF

      - name: Register Widget in AndroidManifest
        run: |
          sed -i 's|</application>|    <receiver android:name="com.muhammadprayertimes.app.PrayerWidget" android:exported="true">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/prayer_widget_info" />\n        </receiver>\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin Version Conflict
        run: |
          cd android
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy {" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muhammad-prayer-times-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Project Structure
        run: |
          mkdir -p src/components src/utils
          [ -f App.tsx ] && mv App.tsx src/
          [ -f main.tsx ] && mv main.tsx src/
          [ -f index.css ] && mv index.css src/
          [ -f types.ts ] && mv types.ts src/
          [ -f SettingsModal.tsx ] && mv SettingsModal.tsx src/components/
          [ -f audioSynth.ts ] && mv audioSynth.ts src/utils/
          [ -f prayerCalc.ts ] && mv prayerCalc.ts src/utils/

      - name: Install Dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "APP_URL=http://localhost" >> .env

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Initialize Capacitor
        run: npx cap init "Muhammad Prayer Times" "com.muhammadprayertimes.app" --web-dir=dist

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin Version Conflict
        run: |
          cd android
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy {" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'" >> build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: muhammad-prayer-times-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
